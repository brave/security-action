[project]
name = "security-action"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # dependency auditing (reviewdog pip-audit runner)
    "pip-audit~=2.10.1",
    "setuptools~=84.0.0",
]

[dependency-groups]
# Model scanning deps are installed on demand (`uv sync --group ...`), decided
# per run by src/modelscanDependencyGroups.js — the uv cache rarely helps
# (the action does not run on the default branch, so PR runs start cold).
#
# modelscan group: all scanners except keras/saved_model — pickle, numpy,
# pytorch (zip+pickle, no torch needed), h5. numpy is a hard modelscan dep,
# h5py is only ~5MB on top. ~20MB over the pip-audit-only install.
modelscan = [
    "modelscan~=0.8",
    "numpy>=1.20",
    "h5py>=3.0",
]
# tensorflow group: keras (.keras) + saved_model (.pb) scanners.
# ~685MB with transitive deps — synced only when the PR actually touches
# such files (or SEC_ACTION_MODELSCAN_HEAVY is set).
tensorflow = ["tensorflow>=2.10"]

[tool.uv]
# No python package is built from this repo; uv only manages the dependency
# environment (uv.lock pins every version).
# Dependency cooldown: exclude packages published within the window when
# re-locking, so a freshly published malicious release can't be picked up
# immediately (CI always runs --frozen, this only affects `uv lock`).
exclude-newer = "7 days"
package = false
