rules:
  - id: system-network-context
    metadata:
      author: Anthony Tseng <anthony@brave.com>
      references:
        - https://github.com/brave/internal/issues/1932
      source: https://github.com/brave/security-action/blob/main/assets/opengrep_rules/client/system-network-context.yaml
      assignees: |
        darkdh
        diracdeltas
      category: privacy
    message: |
      The system network context is shared by every profile and ignores a profile's own network settings, including the Tor proxy. Requests made for a profile or page must use that profile's storage partition instead (`profile->GetDefaultStoragePartition()` or the frame's `GetStoragePartition()`). If this request is browser-wide, ignore this finding.
    severity: WARNING
    languages:
      - cpp
    pattern-either:
      - pattern: SystemNetworkContextManager::GetInstance()
      - pattern: $X->system_network_context_manager()
      - pattern: $X->shared_url_loader_factory()
