name: image

# Builds and pushes the prebuilt runtime image consumed by
# brave/workflows (.github/workflows/security-action.yml container:):
# ghcr.io/brave/security-action:{latest,v1,sha-<short>}.
#
# Every tool pin is computed from the same files the runtime installers
# read (src/installLandrun.js, src/installOpengrep.js,
# scripts/install-reviewdog.sh, package.json) — the Dockerfile receives
# them as build args and contains no duplicated pins. Rebuilds are
# triggered by anything that changes the baked toolchain or its lockfiles.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - pyproject.toml
      - uv.lock
      - src/installLandrun.js
      - src/installOpengrep.js
      - scripts/install-reviewdog.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute tool pins from source
        id: pins
        run: |
          set -euo pipefail
          PIN_JSON="$(node --input-type=module -e "
            import { LANDRUN_VERSION, LANDRUN_BIN_SHA256 } from './src/installLandrun.js'
            import { OPENGREP_VERSION, OPENGREP_BIN_SHA256 } from './src/installOpengrep.js'
            import { readFileSync } from 'fs'
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
            const pnpmVersion = pkg.packageManager.split('@')[1]
            const reviewdogVersion = readFileSync('actions/main/action.yml', 'utf8')
              .match(/install-reviewdog\.sh (v[0-9.]+)/)?.[1]
            if (!reviewdogVersion) throw new Error('reviewdog pin not found in actions/main/action.yml')
            console.log(JSON.stringify({
              landrun_version: LANDRUN_VERSION,
              landrun_sha256: LANDRUN_BIN_SHA256[LANDRUN_VERSION]['landrun-linux-amd64'],
              opengrep_version: OPENGREP_VERSION,
              opengrep_sha256: OPENGREP_BIN_SHA256[OPENGREP_VERSION]['opengrep_manylinux_x86'],
              reviewdog_version: reviewdogVersion,
              pnpm_version: pnpmVersion
            }))
          ")"
          echo "json=$PIN_JSON" >> "$GITHUB_OUTPUT"
          # Fail closed when any pin is missing — a null build arg would
          # silently produce an image without that tool.
          node -e "
            const pins = JSON.parse(process.argv[1])
            for (const [k, v] of Object.entries(pins)) {
              if (!v) { console.error('missing pin: ' + k); process.exit(1) }
            }
            console.log(pins)
          " "$PIN_JSON"

      - name: Extract reviewdog tarball sha256
        id: reviewdog
        run: |
          set -euo pipefail
          SHA="$(awk '/Linux-x86_64\)/{f=1} f && /SHA256=/{sub(/SHA256=/, ""); gsub(/[ ;]/, ""); print; exit}' scripts/install-reviewdog.sh)"
          [ -n "$SHA" ] || { echo "reviewdog Linux-x86_64 sha not found" >&2; exit 1; }
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b9bd4a8 # v3.11.1

      - uses: docker/login-action@5e57f957a7a8f57e101ef357d5c17d00f413ccea # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/brave/security-action:latest
            ghcr.io/brave/security-action:v1
            ghcr.io/brave/security-action:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            LANDRUN_VERSION=${{ fromJson(steps.pins.outputs.json).landrun_version }}
            LANDRUN_SHA256=${{ fromJson(steps.pins.outputs.json).landrun_sha256 }}
            OPENGREP_VERSION=${{ fromJson(steps.pins.outputs.json).opengrep_version }}
            OPENGREP_SHA256=${{ fromJson(steps.pins.outputs.json).opengrep_sha256 }}
            REVIEWDOG_VERSION=${{ fromJson(steps.pins.outputs.json).reviewdog_version }}
            REVIEWDOG_SHA256=${{ steps.reviewdog.outputs.sha256 }}
            PNPM_VERSION=${{ fromJson(steps.pins.outputs.json).pnpm_version }}

      # Private org repos can only pull the package anonymously when it is
      # public. GITHUB_TOKEN often lacks admin:packages — best effort; if
      # this 403s, flip visibility once manually (PR body documents this).
      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /orgs/brave/packages/container/security-action \
            -f visibility=public || \
            echo "::warning::Could not set package visibility — set ghcr.io/brave/security-action to public manually once"
