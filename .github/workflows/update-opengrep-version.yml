name: Update Opengrep Version

on:
  schedule:
    # Run every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-opengrep-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.x'

      - name: Run opengrep version update script
        id: update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const path = require('path')
            const updateOpengrepVersion = (await import(path.join(process.cwd(), 'src/updateOpengrepVersion.js'))).default
            const result = await updateOpengrepVersion()

            core.setOutput('updated', result.updated)
            if (result.updated) {
              core.setOutput('old_version', result.oldVersion)
              core.setOutput('new_version', result.newVersion)
            }

      - name: Check for changes and create PR
        if: steps.update.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.update.outputs.old_version }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
          BRANCH_NAME: automated/update-opengrep-version
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to new branch
          git checkout -b ${BRANCH_NAME}

          # Commit changes
          git add src/installOpengrep.js
          git commit -m "Update opengrep to ${NEW_VERSION}"

          # Push branch
          git push origin ${BRANCH_NAME} --force

          # Create PR; if it already exists, refresh title/body so they
          # don't stay stuck at the versions from the original run.
          TITLE="Update opengrep to ${NEW_VERSION}"
          BODY="This PR automatically updates opengrep from ${OLD_VERSION} to ${NEW_VERSION}.

          ## Changes
          - Updated \`src/installOpengrep.js\` with new version and SHA256 hash

          This PR was automatically generated by the \`update-opengrep-version\` workflow."

          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head ${BRANCH_NAME} \
            --label dependencies \
            --repo ${GITHUB_REPOSITORY} \
            || gh pr edit ${BRANCH_NAME} --title "$TITLE" --body "$BODY" --repo ${GITHUB_REPOSITORY}

      - name: No update needed
        if: steps.update.outputs.updated != 'true'
        run: echo "Opengrep is already up to date"
