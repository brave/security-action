name: sandbox hardening
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/with-sandbox.sh'
      - 'scripts/sandbox-honeypot.sh'
      - 'src/installLandrun.js'
      - '.github/workflows/sandbox-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/with-sandbox.sh'
      - 'scripts/sandbox-honeypot.sh'
      - 'src/installLandrun.js'
      - '.github/workflows/sandbox-hardening.yml'

permissions: {}

jobs:
  honeypots:
    name: Landlock honeypot checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install landrun
        run: node run.js ./src/installLandrun.js
      - name: Run honeypot probes
        run: bash scripts/sandbox-honeypot.sh