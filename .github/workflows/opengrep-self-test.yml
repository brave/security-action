name: opengrep-self-test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  # This is a public repo, no permissions required to clone
  contents: none
jobs:
  opengrep-self-test:
    name: opengrep-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache opengrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opengrep
          key: opengrep-v1.11.5-${{ runner.os }}
      - name: Install opengrep
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            const installOpengrep = (await import('${{ github.workspace }}/src/installOpengrep.js')).default
            await installOpengrep()
      - run: |
          set -e
          cd assets/opengrep_rules/; opengrep test --strict .
        shell: bash
      - run: |
          JSON=$(opengrep \
            --disable-version-check --strict --json \
            $(find assets/opengrep_rules -name '*.yml' -or -name '*.yaml' -not -name '*.test.yml' -not -name '*.test.yaml' -not -path "assets/opengrep_rules/generated/*" | sed 's/^/-c /g') \
            assets/opengrep_rules/{client,services} || true)
          ERRORS=$(echo "$JSON" | jq '.errors' || true)
          BADERRS=$(echo "$ERRORS" | jq '.[] | select(.level == "error")' || true)
          if [[ -n "$BADERRS" ]]; then
            echo "Opengrep rule / version issue: $BADERRS"
            exit 123
          fi
          RESULTCOUNT=$(echo "$JSON" | tr '\n' ' ' | tr '\t' ' ' | jq '.results | length')
          NUMRESULTS=$(grep -R ruleid: | wc -l)
          if [[ "$RESULTCOUNT" -lt "$NUMRESULTS" ]]; then
            echo "Found fewer than $NUMRESULTS opengrep results"
            exit 122
          fi
        shell: bash
