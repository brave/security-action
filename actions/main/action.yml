name: 'Security Action'
description: 'Collect and Generalize multiple CI Security checks'
inputs:
  # in-name:
  #   description: yadda yadda
  #   required: true
  #   default: 0
  github_token:
    description: |
      Secret token to push review comments, and
      interact with the repository systematically
    required: true
  slack_token:
    description: |
      Secret token to forward findings to slack
    required: false
  assignees:
    description: assign PR to the people linked
    required: false
  hotwords:
    description: body hotwords which should trigger the action
    required: false
  hotwords_enabled:
    description: control if the hotwords should trigger the action
    required: false
  debug:
    description: enables debug output for this action
    required: false
  enabled:
    description: may disable the whole action, big red button for emergency cases
    required: false
  baseline_scan_only:
    description: compare changed files with the base ref, do not scan the entire repo with reviewdog
    required: false
  pip_audit_pypi_index_url:
    description: Pypi index for pip-audit to use in case you have a private index
    required: false
  pip_audit_pypi_insecure_hosts:
    description: Hosts for --trusted-host in pip-audit in case you have an untrusted private index, comma separated
    required: false
  gh_to_slack_user_map:
    description: JSON map of github usernames to slack usernames
    required: false
  codeowners_min_files:
    description: Minimum number of changed files to trigger codeowners comment (default 50)
    required: false
  codeowners_mode:
    description: 'When to post codeowners comment: never, groups, always (default: groups)'
    required: false
  modelscan_enabled:
    description: |
      Comma-separated list of modelscan scanners to enable, or 'all' (default).
      Options: all, pickle, numpy, pytorch, h5, keras, saved_model.
      Lightweight: pickle, numpy, pytorch (numpy dep only).
      Heavyweight: h5 (h5py), keras & saved_model (tensorflow).
      Set to 'false' or empty to disable modelscan entirely.
      Model deps are only installed when the PR contains model files
      (.pkl/.pickle/.joblib/.dill/.dat/.data/.npy/.bin/.pt/.pth/.ckpt/.h5
      → modelscan group; .keras/.pb → also tensorflow group). Set the
      SEC_ACTION_MODELSCAN_HEAVY env var on the job to always install both
      groups (for repos that include model files).
    required: false
outputs:
  reviewdog-findings:
    description: number of reviewdog findings
    value: ${{ steps.script.outputs.findings }}
  safesvg-count:
    description: number of safesvg findings via reviewdog
    value: ${{ steps.script.outputs.safesvg_count }}
  # tfsec-count:
  #   description: number of tfsec findings via reviewdog
  #   value: ${{ steps.script.outputs.tfsec_count }}
  opengrep-count:
    description: number of opengrep findings via reviewdog
    value: ${{ steps.script.outputs.opengrep_count }}
  sveltegrep-count:
    description: number of sveltegrep findings via reviewdog
    value: ${{ steps.script.outputs.sveltegrep_count }}
  npm-audit-count:
    description: number of npm-audit findings via reviewdog
    value: ${{ steps.script.outputs.npm_audit_count }}
  pip-audit-count:
    description: number of pip-audit findings via reviewdog
    value: ${{ steps.script.outputs.pip_audit_count }}
runs:
  using: 'composite'
  steps:
    - name: Store reviewdog enabled
      # inputs.enabled != 'false' && (
      #   (inputs.baseline_scan_only != 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) # reviewdog-enabled-pr
      #   || 
      #   (inputs.baseline_scan_only == 'false' || github.event_name == 'workflow_dispatch') # reviewdog-enabled-full
      # )
      if: ${{ inputs.enabled != 'false' && ( (inputs.baseline_scan_only != 'false' && github.event_name == 'pull_request') || (inputs.baseline_scan_only == 'false' || github.event_name == 'workflow_dispatch') )}}
      id: reviewdog-enabled
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: return true
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Install landrun
      # Sandbox tool for scripts/with-sandbox.sh; installs the pinned binary
      # and appends its directory to GITHUB_PATH. Must run before the
      # dependency-install steps (uv sync / pnpm install are wrapped below).
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |-
          const path = require('path')
          const installLandrun = (await import(path.join('${{ github.action_path }}', '../../src/installLandrun.js'))).default
          await installLandrun()
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      with:
        reviewdog_version: v0.17.5 # Optional. [latest,nightly,v.X.Y.Z]
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      id: npm
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # pnpm install runs PR-controlled lockfiles/manifests; confine it with
      # Landlock: read-only checkout, writable node_modules + pnpm caches +
      # private temp dir, TLS-only egress.
      run: |-
        ACTION_ROOT="${{ github.action_path }}/../.."
        PN_TMP="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pnpm-install.XXXXXX")"
        # pre-create grant paths: landlock binds rules to existing paths only
        mkdir -p "$ACTION_ROOT/node_modules" "$HOME/.local/share/pnpm" "$HOME/.cache/node/corepack" "$HOME/.cache/pnpm/store"
        # Run from the private temp dir: corepack stages the package manager
        # via a _tmp_<hash> file in the CWD, which is denied in a read-only
        # workspace. pnpm -C targets the action checkout instead. corepack
        # resolves the pinned pnpm version from the CWD's package.json, so
        # copy it here (unsandboxed, from the trusted action checkout).
        cp "$ACTION_ROOT/package.json" "$PN_TMP/package.json"
        cd "$PN_TMP"
        # pnpm's self-manager stages its own re-install via a _tmp_<hash>
        # file in the project root — the version already matches
        # packageManager, so switch the behavior off entirely.
        TMPDIR="$PN_TMP" npm_config_manage_package_manager_versions=false SANDBOX_ENV_EXTRA="npm_config_manage_package_manager_versions" \
        bash "$ACTION_ROOT/scripts/with-sandbox.sh" \
          --ignore-missing \
          --ro "$ACTION_ROOT" \
          --rw "$ACTION_ROOT/node_modules" \
          --rw "$PN_TMP" \
          --rw "$HOME/.local/share/pnpm" \
          --rw "$HOME/.cache/node/corepack" --rox "$HOME/.cache/node/corepack" \
          --rw "$HOME/.cache/pnpm" \
          --rw /dev/null \
          --rox /opt/hostedtoolcache \
          --rox /usr \
          --rox /lib \
          --rox /lib64 \
          --ro /etc --ro /run \
          --connect-tcp 443 \
          -- corepack pnpm install --frozen-lockfile -C "$ACTION_ROOT" --store-dir "$HOME/.cache/pnpm/store"
        rc=$?; cd "$ACTION_ROOT"; rm -rf "$PN_TMP"; exit $rc
      shell: bash
    # - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
    #   name: Install tfsec
    #   uses: jaxxstorm/action-install-gh-release@6096f2a2bbfee498ced520b6922ac2c06e990ed2 # v2.1.0
    #   with: # Grab a specific tag with caching
    #     repo: aquasecurity/tfsec
    #     tag: v1.28.14
    #     cache: enable
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Cache opengrep
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.opengrep
        key: opengrep-v1.30.0-${{ runner.os }}
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Install opengrep
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |-
          const path = require('path')
          const installOpengrep = (await import(path.join('${{ github.action_path }}', '../../src/installOpengrep.js'))).default
          await installOpengrep()
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      id: script
      env:
        DEBUG: ${{ (inputs.debug == 'true' || runner.debug) && 'true' || 'false'}}
      with:
        script: |-
          const actionPath = '${{ github.action_path }}/../../'
          const inputs = ${{ toJson(inputs) }}

          const script = require('${{ github.action_path }}/action.cjs')
          await script({github, context, inputs, actionPath, core,
            debug: process.env.DEBUG === 'true'})
