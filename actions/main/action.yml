name: 'Security Action'
description: 'Collect and Generalize multiple CI Security checks'
inputs:
  # in-name:
  #   description: yadda yadda
  #   required: true
  #   default: 0
  github_token:
    description: |
      Secret token to push review comments, and
      interact with the repository systematically
    required: true
  slack_token:
    description: |
      Secret token to forward findings to slack
    required: false
  assignees:
    description: assign PR to the people linked
    required: false
  hotwords:
    description: body hotwords which should trigger the action
    required: false
  hotwords_enabled:
    description: control if the hotwords should trigger the action
    required: false
  debug:
    description: enables debug output for this action
    required: false
  enabled:
    description: may disable the whole action, big red button for emergency cases
    required: false
  baseline_scan_only:
    description: compare changed files with the base ref, do not scan the entire repo with reviewdog
    required: false
  pip_audit_pypi_index_url:
    description: Pypi index for pip-audit to use in case you have a private index
    required: false
  pip_audit_pypi_insecure_hosts:
    description: Hosts for --trusted-host in pip-audit in case you have an untrusted private index, comma separated
    required: false
  gh_to_slack_user_map:
    description: JSON map of github usernames to slack usernames
    required: false
  codeowners_min_files:
    description: Minimum number of changed files to trigger codeowners comment (default 50)
    required: false
  codeowners_mode:
    description: 'When to post codeowners comment: never, groups, always (default: groups)'
    required: false
  modelscan_enabled:
    description: |
      Comma-separated list of modelscan scanners to enable, or 'all' (default).
      Options: all, pickle, numpy, pytorch, h5, keras, saved_model.
      Lightweight: pickle, numpy, pytorch (numpy dep only).
      Heavyweight: h5 (h5py), keras & saved_model (tensorflow).
      Set to 'false' or empty to disable modelscan entirely.
      Model deps are only installed when the PR contains model files
      (.pkl/.pickle/.joblib/.dill/.dat/.data/.npy/.bin/.pt/.pth/.ckpt/.h5
      → modelscan group; .keras/.pb → also tensorflow group). Set the
      SEC_ACTION_MODELSCAN_HEAVY env var on the job to always install both
      groups (for repos that include model files).
    required: false
outputs:
  reviewdog-findings:
    description: number of reviewdog findings
    value: ${{ steps.script.outputs.findings }}
  safesvg-count:
    description: number of safesvg findings via reviewdog
    value: ${{ steps.script.outputs.safesvg_count }}
  # tfsec-count:
  #   description: number of tfsec findings via reviewdog
  #   value: ${{ steps.script.outputs.tfsec_count }}
  opengrep-count:
    description: number of opengrep findings via reviewdog
    value: ${{ steps.script.outputs.opengrep_count }}
  sveltegrep-count:
    description: number of sveltegrep findings via reviewdog
    value: ${{ steps.script.outputs.sveltegrep_count }}
  npm-audit-count:
    description: number of npm-audit findings via reviewdog
    value: ${{ steps.script.outputs.npm_audit_count }}
  pip-audit-count:
    description: number of pip-audit findings via reviewdog
    value: ${{ steps.script.outputs.pip_audit_count }}
runs:
  using: 'composite'
  steps:
    - name: Store reviewdog enabled
      # inputs.enabled != 'false' && (
      #   (inputs.baseline_scan_only != 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) # reviewdog-enabled-pr
      #   || 
      #   (inputs.baseline_scan_only == 'false' || github.event_name == 'workflow_dispatch') # reviewdog-enabled-full
      # )
      if: ${{ inputs.enabled != 'false' && ( (inputs.baseline_scan_only != 'false' && github.event_name == 'pull_request') || (inputs.baseline_scan_only == 'false' || github.event_name == 'workflow_dispatch') )}}
      id: reviewdog-enabled
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        # retries: exponential backoff via @octokit/plugin-retry for transient
        # 5xx/timeouts. Default retry-exempt-status-codes (400/401/403/404/422)
        # keeps permission/validation errors fail-fast.
        retries: 3
        script: return true
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      id: runtime
      name: Detect prebuilt image runtime
      # Inside the OCI image (ghcr.io/brave/security-action) the build
      # manifest exists and every pinned tool is baked onto PATH; the
      # host-only setup steps below are skipped then.
      run: |-
        if [ -f /opt/brave-security/manifest.json ]; then
          echo "image=true" >> "$GITHUB_OUTPUT"
        else
          echo "image=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Install landrun
      # Sandbox tool for scripts/with-sandbox.sh (pinned, sha256-checked).
      # Must run before the dependency-install steps below, which execute
      # PR-controlled manifests. Runs through the repo's run.js CLI as a
      # run: step so it also executes inside the job container
      # (github-script steps only run on the host); inside the image the
      # baked binary is reused with no network access.
      run: node "${{ github.action_path }}/../../run.js" "${{ github.action_path }}/../../src/installLandrun.js"
      shell: bash
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' && steps.runtime.outputs.image != 'true' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' && steps.runtime.outputs.image != 'true' }}
      name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Install reviewdog
      # Replaces reviewdog/action-setup@v1.5.0: its generated installer makes
      # a single unretried curl and died on a 504 from the release CDN
      # (PR #523). Same pinned version, downloaded with curl --retry and
      # verified against a pinned SHA256 (scripts/install-reviewdog.sh).
      run: |-
        bash "${{ github.action_path }}/../../scripts/install-reviewdog.sh" v0.17.5
      shell: bash
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      id: npm
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # pnpm install runs PR-controlled lockfiles/manifests; confine it with
      # Landlock: read-only checkout, writable node_modules + pnpm caches +
      # private temp dir, TLS-only egress.
      run: |-
        ACTION_ROOT="${{ github.action_path }}/../.."
        PN_TMP="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pnpm-install.XXXXXX")"
        # Image mode: inside the prebuilt OCI image pnpm itself is baked
        # onto PATH (no corepack registry lookup) and the baked store
        # covers the whole lockfile. When the checked-out pnpm-lock.yaml
        # still hashes to the value recorded at image build time, install
        # offline from the baked store; a PR that changed the lockfile
        # falls back to the online path.
        IMAGE_MODE="false"
        PM_OFFLINE_ARGS=""
        PM_STORE_DIR="$HOME/.cache/pnpm/store"
        PM_GRANTS=""
        if [ -f /opt/brave-security/manifest.json ]; then
          IMAGE_MODE="true"
          LOCK_SHA="$(sha256sum "$ACTION_ROOT/pnpm-lock.yaml" | cut -d' ' -f1)"
          BAKED_SHA="$(sed -n 's/.*"pnpm_lock_sha256": *"\([0-9a-f]*\)".*/\1/p' /opt/brave-security/manifest.json)"
          if [ -n "$BAKED_SHA" ] && [ "$LOCK_SHA" = "$BAKED_SHA" ]; then
            PM_OFFLINE_ARGS="--offline"
            PM_STORE_DIR="/opt/pnpm/store"
            PM_GRANTS="--rw /opt/pnpm/store"
            mkdir -p /opt/pnpm/store
          fi
        fi
        # pre-create grant paths: landlock binds rules to existing paths only
        mkdir -p "$ACTION_ROOT/node_modules" "$HOME/.local/share/pnpm" "$HOME/.cache/node/corepack" "$HOME/.cache/pnpm/store" "$PN_TMP"
        # Run from the private temp dir: corepack stages the package manager
        # via a _tmp_<hash> file in the CWD, which is denied in a read-only
        # workspace. pnpm -C targets the action checkout instead. corepack
        # resolves the pinned pnpm version from the CWD's package.json, so
        # copy it here (unsandboxed, from the trusted action checkout).
        cp "$ACTION_ROOT/package.json" "$PN_TMP/package.json"
        cd "$PN_TMP"
        # pnpm's self-manager stages its own re-install via a _tmp_<hash>
        # file in the project root — the version already matches
        # packageManager, so switch the behavior off entirely.
        # Retry loop: corepack's pnpm version lookup (one unretried
        # registry.npmjs.org request) hard-failed the job during the Oct 22
        # npmjs outage (PRs #2921, #2939, #2966, #3018, #3025, #3027).
        # The landrun sandbox wraps every attempt.
        # Image mode invokes the baked pnpm directly; plain runners go
        # through corepack for the packageManager pin.
        attempt=1
        pnpm_rc=0
        while :; do
          if [ "$IMAGE_MODE" = "true" ]; then
            PM_CMD=(pnpm install --frozen-lockfile $PM_OFFLINE_ARGS -C "$ACTION_ROOT" --store-dir "$PM_STORE_DIR")
          else
            PM_CMD=(corepack pnpm install --frozen-lockfile -C "$ACTION_ROOT" --store-dir "$PM_STORE_DIR")
          fi
          if TMPDIR="$PN_TMP" npm_config_manage_package_manager_versions=false SANDBOX_ENV_EXTRA="npm_config_manage_package_manager_versions" \
          bash "$ACTION_ROOT/scripts/with-sandbox.sh" \
            --ignore-missing \
            --ro "$ACTION_ROOT" \
            --rw "$ACTION_ROOT/node_modules" \
            --rw "$PN_TMP" \
            --rw "$HOME/.local/share/pnpm" \
            --rw "$HOME/.cache/node/corepack" --rox "$HOME/.cache/node/corepack" \
            --rw "$HOME/.cache/pnpm" \
            $PM_GRANTS \
            --rw /dev/null \
            --rox /opt/hostedtoolcache \
            --rox /usr \
            --rox /lib \
            --rox /lib64 \
            --ro /etc --ro /run \
            --connect-tcp 443 \
            -- "${PM_CMD[@]}"; then
            break
          else
            pnpm_rc=$?
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "pnpm install failed after $attempt attempts (last exit $pnpm_rc)" >&2
            break
          fi
          sleep $((15 * 2 ** (attempt - 1))) # 15s, 30s
          attempt=$((attempt + 1))
        done
        cd "$ACTION_ROOT"; rm -rf "$PN_TMP"; exit $pnpm_rc
      shell: bash
    # - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
    #   name: Install tfsec
    #   uses: jaxxstorm/action-install-gh-release@6096f2a2bbfee498ced520b6922ac2c06e990ed2 # v2.1.0
    #   with: # Grab a specific tag with caching
    #     repo: aquasecurity/tfsec
    #     tag: v1.28.14
    #     cache: enable
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' && steps.runtime.outputs.image != 'true' }}
      name: Cache opengrep
      # Skipped inside the prebuilt image: opengrep is baked onto PATH and
      # the container's fresh $HOME makes the cache entry useless there.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.opengrep
        key: opengrep-v1.32.0-${{ runner.os }}
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      name: Install opengrep
      # Runs through run.js as a run: step so it also executes inside the
      # job container; inside the image the baked binary is reused with no
      # network access.
      run: node "${{ github.action_path }}/../../run.js" "${{ github.action_path }}/../../src/installOpengrep.js"
      shell: bash
    - if: ${{ steps.reviewdog-enabled.outputs.result == 'true' }}
      id: script
      name: Run the security action script
      # action.cjs used to run through actions/github-script, which only
      # executes on the host — the job container never saw the main
      # script, its uv sync or the reviewdog runners. run.cjs is a run:
      # step: it executes inside the container and rebuilds the
      # github-script surface (github/context/core) from the standard
      # runner environment. Inputs arrive on stdin as JSON via a quoted
      # heredoc, so no YAML quoting pitfalls.
      env:
        DEBUG: ${{ (inputs.debug == 'true' || runner.debug) && 'true' || 'false'}}
        ACTION_PATH: ${{ github.action_path }}/../../
      run: |-
        node "${{ github.action_path }}/run.cjs" <<'INPUTS_JSON_EOF'
        ${{ toJson(inputs) }}
        INPUTS_JSON_EOF
      shell: bash
