name: 'Sentry Cron Check-in'
description: >-
  Deadman-switch check-in for scheduled workflows to Sentry Crons.
  Needs only Node.js (built-in fetch) on the runner — no install step.
  Reads the semi-secret ingest URL from the SENTRY_CRON_URL environment
  variable and silently no-ops when it is unset, so wiring can ship
  before the secret exists. Never fails the workflow.
inputs:
  monitor:
    description: 'Monitor slug, for log lines only (the slug is embedded in the check-in URL)'
    required: true
  status:
    description: 'Check-in status: in_progress | ok | error'
    required: true
  schedule:
    description: 'Crontab schedule upserted via monitor_config on in_progress (omitted when empty)'
    required: false
    default: ''
  timezone:
    description: 'IANA timezone of the schedule (GitHub Actions crons run in UTC)'
    required: false
    default: 'UTC'
  checkin_margin:
    description: 'Grace minutes before a missed check-in; allow for runner jitter (numeric, omitted when empty)'
    required: false
    default: ''
  max_runtime:
    description: 'Minutes an in_progress check-in may run before the monitor fails (numeric, omitted when empty)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const actionPath = '${{ github.action_path }}/../../'
          const inputs = ${{ toJson(inputs) }}

          const script = require('${{ github.action_path }}/action.cjs')
          await script({inputs, actionPath})